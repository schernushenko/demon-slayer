meta:
  environment: node
  toolchain:
    name: npm
    version: 22

build:
  additionalCommands: npm run build
  artifacts:
    "*": /

run:
  command: DATABASE_PATH=/data/visits.sqlite ADMIN_CONFIG_PATH=/data/admin.config.json TRUST_PROXY=1 npm run start
  containerPort: 3000
  persistenceMount: /data
